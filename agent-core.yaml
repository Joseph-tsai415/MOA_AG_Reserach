# How the agent-harness runs this repository as an agent core.
# See: https://github.com/Joseph-tsai415/agent-harness → doc/ADDING_A_CORE.md
#
# This file does NOT change the science. CLAUDE.md remains the operating manual
# and is not edited; MOA_RUN_DIR and MOA_CJK_FONT stay MOA-owned names, declared
# below, precisely so that stays true.
schema: 1

core:
  name: moa-ag
  display_name: "MOA-AG network pharmacology pipeline"
  version: v11.2

agent:
  instructions: CLAUDE.md
  setting_sources: [project]     # without this, CLAUDE.md is invisible to the agent
  run_dir_env: MOA_RUN_DIR       # CLAUDE.md §2 reads this name
  defaults:
    model: claude-opus-5
    max_turns: 400
    permission_mode: bypassPermissions

python:
  conda_env: moa                 # CLAUDE.md §7: `conda activate moa`
  package_paths: [moa_lib]
  # This list is the container's STARTUP gate (harness/preflight.py, run before
  # `exec "$@"` in entrypoint.sh) -- not decorative. It deliberately mirrors the
  # pre-refactor entrypoint.sh import-check set (rdkit, matplotlib, networkx,
  # numpy, scipy, pandas, requests, reportlab, pymupdf, matplotlib_venn) plus the
  # three moa_lib gate modules, which are a genuine net addition the old check
  # lacked. Trimming this to "just the new modules" silently drops startup
  # verification for numpy/scipy/pandas -- the packages most likely to be
  # findable-but-broken (bad wheel, missing shared lib) -- and lets a broken
  # image pass preflight only to die mid-run instead of at startup.
  import_check:
    - moa_lib.citation_grounding
    - moa_lib.provenance
    - moa_lib.specificity_controls
    - rdkit
    - matplotlib
    - networkx
    - numpy
    - scipy
    - pandas
    - requests
    - reportlab
    - pymupdf
    - matplotlib_venn
  requirements:
    base:  runner-requirements/base.txt
    omics: runner-requirements/omics.txt
    full:  runner-requirements/full.txt
  default_profile: omics

inputs:
  # string_list means: ONE comma-separated value on the CLI, a list internally. The
  # delimiter is fixed at ',' by the harness, not per-core -- worker.py joins on it and
  # doc/API_PROTOCOL.md documents it, so it is a contract, not a preference.
  #
  # Do NOT add a "notes"/"context" input here for free-text requester context --
  # the harness already owns that via its own --extra flag, which the prompt
  # template renders as {extra}. A per-core input duplicating it would be
  # accepted on the CLI but never wired to anything the agent sees.
  - {name: compounds, type: string_list, required: true,  cli: --compounds}
  - {name: disease,   type: string,      required: true,  cli: --disease}

run_dir:
  template: "{compounds.first|slug}_{disease|slug}"
  fallback: "{disease|slug}"
  session_suffix: "_session{n}"
  probe_base: probe

prompt:
  # prompt.probe is deliberately omitted: the probe prompt is an infrastructure
  # check owned by the harness (harness/probe_prompt.md), not pipeline science. A
  # core overrides it only if it needs a different probe; MOA does not.
  run: .agent-core/prompt_run.md

progress:
  milestones:
    - {artifact: step0_provenance.md,           phase: provenance,    percent: 5,   label: "Provenance & plausibility gate"}
    - {artifact: step1_target_list_A.md,        phase: targets,       percent: 20,  label: "Compound targets (List A)"}
    - {artifact: step2_disease_genes_B.md,      phase: disease_genes, percent: 35,  label: "Disease genes (List B)"}
    # Conditional (CLAUDE.md §3 Transcriptomics Track): run only when a suitable
    # expression dataset exists; never simulated. The schema has no "optional:"
    # field, and none is needed -- progress is highest-artifact-seen, so a milestone
    # that is never written simply never fires. Its absence is normal, not a stall.
    - {artifact: step2_disease_signature.md,    phase: disease_genes, percent: 38,  label: "Data-driven disease signature"}
    - {artifact: step3_hub_targets.md,          phase: intersection,  percent: 45,  label: "Hub targets locked"}
    - {artifact: step4_moa_summary.md,          phase: mechanism,     percent: 60,  label: "Mechanism narrative"}
    - {artifact: step4_moa_table.md,            phase: mechanism,     percent: 65,  label: "MOA overview table"}
    # Conditional, same as step2_disease_signature.md above: L1000 signature reversal
    # only runs when a disease signature was derived. Absence is normal, not a stall.
    - {artifact: step4_signature_reversal.md,   phase: mechanism,     percent: 68,  label: "L1000 signature reversal"}
    - {artifact: validation_plan.md,            phase: report,        percent: 75,  label: "Validation roadmap"}
    - {artifact: step5_final_report.md,         phase: report,        percent: 80,  label: "Final report drafted"}
    - {artifact: step5_confidence_dashboard.md, phase: report,        percent: 83,  label: "Confidence dashboard"}
    - {artifact: data_integrity_check.md,       phase: report,        percent: 86,  label: "Lineage self-audit"}
    - {artifact: report_qa_review.md,           phase: qa_review,     percent: 90,  label: "Report QA review"}
    - {artifact: result.pdf,                    phase: pdf,           percent: 100, label: "PDF deliverable"}

outcome:
  # A halt is the pipeline refusing to manufacture a result. It is a VALID
  # scientific outcome and must never be reported as an error.
  halts:
    HALT_provenance.md: provenance_gate
    # Inherited verbatim from the pre-refactor classify.py, and pinned by a golden
    # test. CLAUDE.md §3 actually defines two Step-3 halt triggers -- no intersection
    # at all, and an overlap indistinguishable from random -- and this single reason
    # tag covers both. Imprecise, but changing it is a behaviour change, not a
    # refactor; worth revisiting once the refactor is complete.
    HALT_no_intersection.md: no_specificity
  # success_requires AND deliverable are BOTH required -- they are conjunctive, not
  # alternatives. Together they reproduce the pinned behaviour: report + PDF ->
  # completed; report alone -> failed/incomplete_pdf. Note "deliverable" here means
  # "a required output artifact", which is narrower than CLAUDE.md §8's human sense of
  # the word (there, the REPORT is the deliverable and the PDF is its rendering).
  success_requires: [step5_final_report.md]
  deliverable: result.pdf
  headline:
    artifact: step5_final_report.md
    section: "Bottom Line"
  qa:
    artifact: report_qa_review.md
    verdicts: [SHIP, FIX-FIRST, BLOCK]
    blocking: [BLOCK]

image:
  required_paths: [CLAUDE.md, moa_lib, .claude/skills]
  reference_data:
    # ~322 MB, over GitHub's per-file limit, so NOT in git. The upstream host
    # 504s often enough that downloading at RUN time is a liability — the image
    # carries it, and a build without it fails rather than degrading silently.
    - path: .claude/skills/mirna-targets/data/hsa_MTI.csv
      min_bytes: 100000000
      required: true
      provision: "python .claude/skills/mirna-targets/scripts/download_reference_data.py"
  exclude:
    - results/
    - reviews/
    - reviews_archive/
    - Schollar_System/
    - validation/
    - docs/
    - .claude/settings.local.json
    # Single-level glob by design: exactly one skill has a data/ dir today
    # (mirna-targets, re-included below), so this is moot as written. Would need
    # widening (e.g. "**/data/") if another skill ever nests a cache deeper.
    - ".claude/skills/*/data/"
    - "!.claude/skills/mirna-targets/data/"
  env:
    MOA_CJK_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

artifacts:
  exclude: [_pdf_preview/, geo_tmp/, tool-results/, "**/__pycache__/**"]
